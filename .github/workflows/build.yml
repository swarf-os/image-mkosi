name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Pinned mkosi (SPEC II-3): v27.1. The action also opens /dev/kvm to the
      # runner user and allows unprivileged user namespaces: no sudo in our build.
      - uses: systemd/mkosi@ecf7f5702bb2052b7a69cab3fe7d37bc3b9ad77b

      # The Arch Linux Archive is a single volunteer host and is sometimes slow.
      # Keep downloaded packages between runs; the key follows the snapshot date.
      - name: Package cache
        uses: actions/cache@v4
        with:
          path: mkosi.cache
          key: mkosi-cache-${{ hashFiles('mkosi.conf') }}
          restore-keys: mkosi-cache-

      - name: Build
        run: scripts/build.sh

      - name: Boot test (qemu + KVM)
        run: scripts/boot-test.sh
        env:
          BOOT_TIMEOUT: "300"

      - name: Show the end of the logs on failure
        if: failure()
        run: |
          for f in logs/*.log; do echo "::group::$f"; tail -n 200 "$f"; echo "::endgroup::"; done

      - name: Upload logs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            logs/
            mkosi.output/*.manifest
          if-no-files-found: ignore
