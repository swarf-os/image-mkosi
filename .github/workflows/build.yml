name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Pinned mkosi (SPEC II-3): v27.1. The action also opens /dev/kvm to the
      # runner user and allows unprivileged user namespaces: no sudo in our build.
      - uses: systemd/mkosi@ecf7f5702bb2052b7a69cab3fe7d37bc3b9ad77b

      # The Arch Linux Archive is a single volunteer host and is sometimes slow.
      # Keep downloaded packages and repository metadata between runs (not the
      # tools tree: some of its files are unreadable to the runner user, so
      # tar fails and nothing is saved). Restore and save are separate so
      # the cache is saved even when a later step fails.
      # Cache by Arch Linux Archive date: editing mkosi.conf for anything else
      # keeps the downloaded packages (scripts/build.sh drops stale metadata).
      - name: Cache key
        id: cache
        run: echo "snapshot=$(sed -n 's|^Snapshot=||p' mkosi.conf | tr / -)" >>"$GITHUB_OUTPUT"

      - name: Restore package cache
        uses: actions/cache/restore@v4
        with:
          path: |
            mkosi.cache
            mkosi.pkgcache
          key: mkosi-pkg-${{ steps.cache.outputs.snapshot }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mkosi-pkg-${{ steps.cache.outputs.snapshot }}-
            mkosi-pkg-

      # Throw-away keys for this test bench, in repository secrets (see
      # scripts/signing-keys.sh); never written to the cache or the artifacts.
      - name: Signing keys
        run: scripts/signing-keys.sh
        env:
          SIGNING_KEY: ${{ secrets.SWARF_SIGNING_KEY }}
          SIGNING_CERT: ${{ secrets.SWARF_SIGNING_CERT }}
          ON_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build
        run: scripts/build.sh

      - name: Save package cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            mkosi.cache
            mkosi.pkgcache
          key: mkosi-pkg-${{ steps.cache.outputs.snapshot }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Boot test (qemu + KVM)
        run: scripts/boot-test.sh
        env:
          BOOT_TIMEOUT: "300"

      - name: Secure Boot tests (tampered images must not boot)
        run: scripts/secureboot-test.sh
        env:
          NEG_TIMEOUT: "180"

      - name: Show the end of the logs on failure
        if: failure()
        run: |
          for f in logs/*.log; do echo "::group::$f"; tail -n 200 "$f"; echo "::endgroup::"; done

      - name: Upload logs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            logs/
            mkosi.output/*.manifest
          if-no-files-found: ignore
