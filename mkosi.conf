# swarf (image-mkosi): image-based swarf on the ParticleOS model.
# Step 2: console image, UKI and systemd-boot signed for Secure Boot, /usr
# verity signed. Encryption (step 3), accounts (step 4), A/B updates (step 5)
# come later.
#
# Signing keys: mkosi.key and mkosi.crt next to this file, never committed
# (.gitignore). mkosi picks them up for SecureBootKey=/SecureBootCertificate=
# and VerityKey=/VerityCertificate= (one key for both, as ParticleOS does;
# SPEC section 8 splits them later). The CI writes them from repository secrets.

[Config]
MinimumVersion=27

[Distribution]
Distribution=arch
# Arch Linux Archive date, kept 14 days behind today (SPEC section 4, D-3).
# Moved forward only after the image passed its tests.
Snapshot=2026/11/09

[Build]
ToolsTree=default
ToolsTreeDistribution=arch
CacheDirectory=mkosi.cache

[Output]
ImageId=swarf
Output=%i_%v_%a
OutputDirectory=mkosi.output
Format=disk
SplitArtifacts=uki,partitions
ManifestFormat=json

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImageFormat=%i_%v_%a
KernelCommandLine=
        root=dissect
        mount.usr=dissect
        rw
        systemd.image_policy=esp=unprotected:usr=signed:root=unprotected+absent:swap=absent:home=absent:=ignore
        systemd.image_filter=usr=swarf_*:usr-verity=swarf_*:usr-verity-sig=swarf_*:root=swarf-*

# Every root package is named here; the CI keeps the full closure in the
# JSON manifest (mkosi.output/*.manifest).
Packages=
        bash
        btrfs-progs
        coreutils
        dbus-broker-units
        diffutils
        dosfstools
        e2fsprogs
        findutils
        gawk
        grep
        gzip
        iproute2
        iputils
        kbd
        kmod
        less
        linux
        nano
        procps-ng
        sed
        shadow
        systemd
        systemd-sysvcompat
        tar
        util-linux
        which
        zstd

RemoveFiles=
        /boot/*-ucode.img
        /etc/arch-release

[Validation]
# Signs systemd-boot and the UKI, and puts PK/KEK/db enrollment files in
# /loader/keys/auto on the ESP (SecureBootAutoEnroll= defaults to yes):
# systemd-boot enrolls them when the firmware is in setup mode.
SecureBoot=yes
# Fail the build if the /usr verity signature partition is missing.
Verity=signed
# No TPM in this model (LUKS passphrase only): no signed PCR policy.
SignExpectedPcr=no

[Runtime]
# OVMF with Secure Boot, empty variables (setup mode): the VM enrolls our keys
# from the ESP at first boot, then boots with Secure Boot enforced.
Firmware=uefi-secure-boot
RuntimeSize=8G
RAM=2G
CPUs=2
