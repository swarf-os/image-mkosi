# swarf (image-mkosi): image-based swarf on the ParticleOS model.
# Step 1: console image, unsigned, unencrypted. Signing (step 2),
# encryption (step 3), accounts (step 4), A/B updates (step 5) come later.

[Config]
MinimumVersion=27

[Distribution]
Distribution=arch
# Arch Linux Archive date, kept 14 days behind today (SPEC II-3, former D-22).
# Moved forward only after the image passed its tests.
Snapshot=2026/11/09

[Build]
ToolsTree=default
ToolsTreeDistribution=arch
CacheDirectory=mkosi.cache

[Output]
ImageId=swarf
Output=%i_%v_%a
OutputDirectory=mkosi.output
Format=disk
SplitArtifacts=uki,partitions
ManifestFormat=json

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImageFormat=%i_%v_%a
KernelCommandLine=
        root=dissect
        mount.usr=dissect
        rw
        systemd.image_policy=esp=unprotected:usr=verity:root=unprotected+absent:swap=absent:home=absent:=ignore
        systemd.image_filter=usr=swarf_*:usr-verity=swarf_*:root=swarf-*

# Every root package is named here; the CI keeps the full closure in the
# JSON manifest (mkosi.output/*.manifest).
Packages=
        bash
        btrfs-progs
        coreutils
        dbus-broker-units
        diffutils
        dosfstools
        e2fsprogs
        findutils
        gawk
        grep
        gzip
        iproute2
        iputils
        kbd
        kmod
        less
        linux
        nano
        procps-ng
        sed
        shadow
        systemd
        systemd-sysvcompat
        tar
        util-linux
        which
        zstd

RemoveFiles=
        /boot/*-ucode.img
        /etc/arch-release

[Runtime]
RuntimeSize=8G
RAM=2G
CPUs=2
