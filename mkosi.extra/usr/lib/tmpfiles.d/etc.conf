# The image ships only /usr. mkosi.finalize keeps the build-time /etc in
# /usr/share/factory/etc; these lines link what the system needs back into
# the (empty, first-boot) /etc. "L?" = only if the factory copy exists.
L  /etc/os-release - - - - ../usr/lib/os-release
L+ /etc/mtab       - - - - ../proc/self/mounts
L  /etc/issue
L  /etc/pam.d
L  /etc/security
L  /etc/login.defs
L  /etc/nsswitch.conf
L  /etc/profile
L  /etc/profile.d
L? /etc/bash.bashrc
L? /etc/bash.bash_logout
L? /etc/shells
L? /etc/environment
L? /etc/locale.conf
L? /etc/ld.so.conf
L? /etc/ld.so.conf.d
L? /etc/ssl
L? /etc/ca-certificates
L? /etc/xdg
L? /etc/services
L? /etc/protocols
L? /etc/skel
L? /etc/nanorc
